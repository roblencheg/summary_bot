# AICODE-NOTE: spec-driven-ru — форк схемы spec-driven (openspec/schemas/spec-driven-ru)
# с инструкциями и шаблонами на русском.
schema: spec-driven-ru

# Контекст проекта — показывается ИИ при создании артефактов OpenSpec.
context: |
  Что делает продукт и для кого, устройство проекта, сущности и эндпоинты —
  в AGENTS.md и docs/project.md, они источник правды.

  Стек: Node.js 24, TypeScript, Fastify (server/), React 19 + React Router +
  Rsbuild (src/), zod-схемы в shared/, локальная SQLite/файловое хранилище и внешний AI API через
  server/platform.ts.

  ЯЗЫК: все артефакты OpenSpec пишутся на русском. На английском остаются
  только структурные маркеры, которые парсит openspec (## Why, ## What Changes,
  ## ADDED/MODIFIED/REMOVED/RENAMED Requirements, "### Requirement:",
  "#### Scenario:", **WHEN**/**THEN**, ключевые слова SHALL/MUST, чекбоксы
  "- [ ] X.Y"), а также идентификаторы кода и имена capability (kebab-case).

rules:
  proposal:
    - Пиши на русском языке. Заголовки секций (## Why и т.д.) не переводить.
    - Имена capability — kebab-case на английском, описания — на русском.
  specs:
    - Названия требований и сценариев, описания, текст WHEN/THEN — на русском.
    - Структурные маркеры и ключевые слова SHALL/MUST — строго на английском.
    - Текст каждого требования обязан содержать буквальное SHALL или MUST
      («Система SHALL …»).
  design:
    - Весь документ на русском, включая заголовки секций (см. шаблон).
  tasks:
    - Названия групп и текст задач — на русском, формат чекбоксов "- [ ] X.Y".
    - Задача должна быть выполнима ИИ-агентом за один сеанс без уточнений.
