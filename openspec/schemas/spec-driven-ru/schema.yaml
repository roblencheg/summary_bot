# AICODE-NOTE: форк стандартной схемы spec-driven с инструкциями и шаблонами на русском.
# Жёсткое правило: структурные маркеры, которые парсит openspec (## Why, ## What Changes,
# ## ADDED/MODIFIED/REMOVED/RENAMED Requirements, "### Requirement:", "#### Scenario:",
# ключевые слова SHALL/MUST, чекбоксы "- [ ] X.Y"), остаются на английском —
# иначе ломаются validate/archive. Весь остальной текст — на русском.
name: spec-driven-ru
version: 1
description: Стандартный процесс OpenSpec на русском — proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Предложение изменения — что меняем и зачем
    template: proposal.md
    instruction: >
      Создай документ-предложение, который фиксирует, ЗАЧЕМ нужно это изменение.

      ВЕСЬ ТЕКСТ ПИШИ НА РУССКОМ ЯЗЫКЕ. Идентификаторы кода, имена файлов и
      технические термины без устоявшегося перевода — на английском.
      Заголовки секций НЕ переводить — их парсит валидатор.

      Первая строка файла — заголовок первого уровня `# <краткое название изменения
      на русском>` (напр., `# Редактор каталога для администратора`). Это
      человекочитаемое имя изменения, оно показывается в списке в UI — пиши его
      на русском и по сути. В отличие от него, заголовки секций уровня `##` ниже
      НЕ переводить.


      Секции:

      - **## Why**: 1–3 предложения о проблеме или возможности (50–1000 символов).
      Какую проблему решаем? Почему сейчас?

      - **## What Changes**: список изменений по пунктам. Конкретно: новые
      возможности, модификации, удаления. Ломающие изменения помечай **BREAKING**.

      - **## Capabilities**: какие спеки будут созданы или изменены:
        - **### New Capabilities**: новые capability. Каждая станет specs/<name>/spec.md.
          Имена — kebab-case на английском (например, `public-calendar`, `admin-auth`),
          описание — на русском.
        - **### Modified Capabilities**: существующие capability, у которых меняются
          ТРЕБОВАНИЯ (а не детали реализации). Сверься с openspec/specs/. Если
          требования не меняются — оставь пустым.
      - **## Impact**: затронутый код, API, зависимости, системы.


      ВАЖНО: секция Capabilities — контракт между proposal и specs. Перед
      заполнением изучи существующие спеки. Каждой capability отсюда будет
      соответствовать файл спеки.


      Кратко (1–2 страницы). Фокус на «зачем», а не «как» — детали реализации
      живут в design.md.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Спецификации поведения (дельты требований)
    template: spec.md
    instruction: >
      Создай файлы спецификаций, определяющие, ЧТО должна делать система.

      ВЕСЬ СОДЕРЖАТЕЛЬНЫЙ ТЕКСТ — НА РУССКОМ ЯЗЫКЕ: названия требований,
      их описания, названия и текст сценариев. Структурные маркеры ниже —
      строго на английском, их парсит машина.


      Один файл спеки на каждую capability из секции Capabilities предложения:

      - новые: specs/<capability>/spec.md с именем из proposal;

      - изменяемые: имя папки берётся из существующей openspec/specs/<capability>/.


      Дельта-операции (строго такие ## заголовки, на английском):

      - **## ADDED Requirements** — новые требования

      - **## MODIFIED Requirements** — изменённое поведение; ОБЯЗАТЕЛЬНО
      полный обновлённый текст требования

      - **## REMOVED Requirements** — удаляемое; ОБЯЗАТЕЛЬНО **Reason** и **Migration**

      - **## RENAMED Requirements** — только переименование; формат FROM:/TO:


      Формат требований:

      - Каждое требование: `### Requirement: <название на русском>` и следом описание.

      - Текст требования ОБЯЗАН содержать английское ключевое слово SHALL или MUST
      (валидатор ищет буквальную подстроку). Конвенция проекта:
      «Система SHALL <действие на русском>…».

      - Каждый сценарий: `#### Scenario: <название на русском>`.

      - **КРИТИЧНО**: у сценария ровно 4 решётки (`####`). Три решётки или
      буллеты молча не распарсятся.

      - Маркеры **WHEN**/**THEN**/**AND** — на английском, текст после них — на русском.

      - У каждого требования — минимум один сценарий.


      Порядок работы с MODIFIED:

      1. Найди требование в openspec/specs/<capability>/spec.md

      2. Скопируй БЛОК ЦЕЛИКОМ (от `### Requirement:` со всеми сценариями)

      3. Вставь под `## MODIFIED Requirements` и отредактируй

      4. Текст заголовка должен совпадать с существующим (пробелы не важны)


      Частая ошибка: MODIFIED с неполным содержимым теряет детали при архивации.
      Если добавляешь новое, не меняя существующее поведение, — используй ADDED.


      Пример:

      ```

      ## ADDED Requirements


      ### Requirement: Просмотр календаря месяца

      Система SHALL показывать партнёру календарь выбранного месяца со всеми
      разделами, доступными его типу календаря.


      #### Scenario: Открытие по прямой ссылке

      - **WHEN** гость открывает публичную ссылку календаря

      - **THEN** система показывает разделы с пометкой «вся сеть» без входа


      ## REMOVED Requirements


      ### Requirement: Устаревший экспорт

      **Reason**: заменён новым механизмом публикации

      **Migration**: использовать /api/v2/export

      ```


      Спеки должны быть проверяемыми — каждый сценарий это потенциальный тест-кейс.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Техническое решение — как реализуем
    template: design.md
    instruction: >
      Создай документ дизайна, объясняющий, КАК реализовать изменение.
      ВЕСЬ ДОКУМЕНТ — НА РУССКОМ ЯЗЫКЕ (design.md машиной не парсится,
      здесь английские только идентификаторы кода и термины).


      Когда design.md нужен (создавай, только если применимо хотя бы одно):

      - сквозное изменение (несколько модулей) или новый архитектурный паттерн

      - новая внешняя зависимость или заметные изменения модели данных

      - сложность в безопасности, производительности или миграции

      - неоднозначность, требующая технических решений до кода


      Секции (заголовки из шаблона):

      - **Контекст**: фон, текущее состояние, ограничения

      - **Цели / Не-цели**: что решение достигает и что явно вне рамок

      - **Решения**: ключевые технические выборы с обоснованием (почему X, а не Y),
      с рассмотренными альтернативами

      - **Риски / Компромиссы**: формат «[Риск] → Митигация»

      - **План миграции**: шаги выката и отката (если применимо)

      - **Открытые вопросы**: нерешённое


      Фокус на архитектуре и подходе, а не построчной реализации.
      Мотивация — в proposal, требования — в specs.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Чек-лист реализации
    template: tasks.md
    instruction: >
      Создай список задач, разбивающий реализацию на шаги.
      ТЕКСТ ЗАДАЧ И НАЗВАНИЯ ГРУПП — НА РУССКОМ ЯЗЫКЕ.


      **ВАЖНО: строго следуй шаблону.** Фаза apply парсит чекбоксы для
      отслеживания прогресса. Задачи не в формате `- [ ] X.Y` не трекаются.


      Правила:

      - Группируй связанные задачи под нумерованными заголовками `## N. <Группа>`

      - Каждая задача — чекбокс: `- [ ] X.Y Описание задачи`

      - Задача должна выполняться ИИ-агентом за один сеанс без уточнений

      - Порядок — по зависимостям (что должно быть сделано раньше)

      - Задача должна быть проверяемой — понятно, когда она выполнена


      Пример:

      ```

      ## 1. Схема данных


      - [ ] 1.1 Миграция: таблицы months и sections

      - [ ] 1.2 Модели и zod-схемы в backend/src/models


      ## 2. API


      - [ ] 2.1 Репозиторий month-repository.ts

      - [ ] 2.2 Роутер months-router.ts + подключение в app.ts

      ```


      Что строить — в specs, как строить — в design.
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Прочитай файлы контекста, выполняй незавершённые задачи по порядку,
    отмечай выполненные по ходу работы. Общайся с пользователем на русском.
    Остановись и спроси, если упёрся в блокер или нужна ясность.
